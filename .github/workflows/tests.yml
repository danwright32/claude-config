name: tests

# Runs on EVERY push and pull request, with no path filter, and that is deliberate. The suite reads
# claude-sync and its own file, but it also reads README.md and DESIGN.md (the checks that the
# documented state files and the measured thresholds still match the code), and it runs git ls-files
# over the whole tree to prove no Python bytecode is tracked. A filter derived from "where the code
# lives" would skip precisely the change that breaks it, and a skipped job is indistinguishable from
# a passing one (L88).
#
# Pushes are watched on main only, with pull requests covering everything on its way there. That is
# a filter on WHERE, not on WHAT, so it creates none of the blind spot above: every change still
# gets a full unfiltered run, once (a push to main whose exact tree a pull request run already
# passed stands on that run, #2717, below at the deal job). Watching every push as well ran the
# suite TWICE for every commit on a branch with a PR open, since both triggers fire, and the second
# run tells you nothing the first did not.
#
# By hand too (claude-config#2463): `gh workflow run tests.yml --ref <branch>` runs a branch with
# no pull request open, which is how a change to this workflow can be measured before anyone is
# asked to review it. Nothing starts it on its own, so it adds no run to any push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On a pull request branch a newer push really does supersede the old one, so the older run is
# cancelled: it tells you nothing you will act on.
#
# On main it is the opposite, and main is NEVER cancelled (claude-config#594). Every commit there is
# a separate change that has landed, and when main goes red the runs for the commits just before
# are exactly the ones that say which commit did it. Cancelling them, as this did for every push
# until October 2026, cost 207 of 602 runs on main in September, and the clearest case was a merge
# that failed with the one run that could have named the culprit (a sync push landing in between)
# cancelled. The sync watcher pushes config changes one commit at a time, so on main several can be
# queued at once, and each still gets its verdict. Not cancelling loses nothing that matters: the
# only thing a run writes is the timings cache.
#
# Turning cancel-in-progress off is only half of that. A concurrency group holds one running and
# one PENDING run, and a newer run queuing into the group cancels the pending one regardless, so
# with one group per branch the middle of three commits landing together still lost its verdict.
# On main the group is therefore the commit itself, and elsewhere it stays the branch.
# tests/test-ci-workflow.sh holds both halves.
concurrency:
  group: tests-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # THREE JOBS WHERE THERE WAS ONE (claude-config#2463). Until 2026-11-09 one job named `suite` ran
  # every suite, two at a time, and took 30 to 40 minutes on a passing run on main (284 suites; the
  # per suite durations its logs print summed to 3500 to 4800 seconds over eight runs that day). The
  # suites are independent, so they now run as PARTS, one job each, side by side:
  #
  #   deal   reads what the last run measured and deals the suites into parts by that cost (L315),
  #          with the runner itself, so the suites are discovered from disk exactly as a full run
  #          discovers them (L96). One job deals and every part reads its deal, so two parts can
  #          never disagree about which suites are whose.
  #   parts  one job per part, each running only its own suites, and refusing outright when the
  #          deal does not cover exactly the suites its tree holds.
  #   suite  the fan in, holding the check name every merge already waited on (L305). It runs
  #          whatever the parts did and is green only when the deal and every part were. It also
  #          merges what each part measured into the one store the next run deals from.
  #
  # The number of parts is the one setting below (HOOK_TESTS_DEAL) and the matrix is read from what
  # the deal job made of it, never written twice. This repository is public, so its runners cost
  # nothing; the price of a part is a runner slot held for its length (L307).
  deal:
    runs-on: ubuntu-26.04
    # Every job here exceeds the suite's own thirty minute ceiling, which test-claude-sync.sh holds
    # for every job in the file (#210). The deal itself takes seconds.
    timeout-minutes: 35
    # The reuse check below reads the Actions API (artifacts and runs), which the workflow's own
    # contents: read token cannot. Granted to this job alone, read only (claude-config#2690).
    permissions:
      contents: read
      actions: read
    outputs:
      timings-key: ${{ steps.timings-cache.outputs.cache-matched-key }}
      parts: ${{ steps.deal.outputs.parts }}
      count: ${{ steps.deal.outputs.count }}
      dealt: ${{ steps.deal.outputs.dealt }}
      # Empty for a full run. Set only when tools/ci-reuse-green-tree.sh proved an earlier green run
      # of exactly this tree; then every part and the fan in skip their work and say which run.
      reused-run: ${{ steps.reuse.outputs.reused-run }}
      reused-sha: ${{ steps.reuse.outputs.reused-sha }}
      reused-url: ${{ steps.reuse.outputs.reused-url }}
      tree: ${{ steps.reuse.outputs.tree }}
      tested-sha: ${{ steps.reuse.outputs.tested-sha }}
    steps:
      # First, as in the parts job, where the runner reads it (claude-config#1901).
      - name: Record when the job started
        run: echo "HOOK_TESTS_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # Pinned to a commit, with the version beside it, so the code that runs cannot change under
      # the same tag, and on a major that runs on Node 24 rather than the deprecated Node 20
      # (claude-config#597). tests/test-ci-workflow.sh refuses a tag, or a major still on Node 20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A REPEAT RUN OF A TREE THAT ALREADY PASSED (claude-config#2690). Dan chose on 2026-11-10 to
      # keep the merge gate that refuses a head behind main (#766) and make the run that follows
      # `gh pr update-branch` cheap instead, when the tree it produces has already passed: on a pull
      # request whose exact tree has an earlier green run of this workflow in this repository (never
      # a fork's), the parts and the fan in still run and report under their own names (L305), but
      # skip their work and say in their logs which run and commit they stood on. Proof only, never
      # a path (L312); the helper says what the proof is, and ANY doubt, an API failure included, is
      # the full suite. A push to main reuses only a PULL REQUEST run of its exact tree, the run its
      # merge followed (Dan, 2026-11-10, #2717), so every tree on main still has a verdict of its own
      # (#594); a sync push, a push elsewhere and a run by hand run in full. The tree is the
      # checkout's, so for a pull request it is GitHub's merge commit, the tree this run would test.
      # A helper that exits non zero is a full run too, whatever it printed before failing.
      - name: A green run of this exact tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_EVENT: ${{ github.event_name }}
          REUSE_REF: ${{ github.ref }}
          REUSE_REPO: ${{ github.repository }}
          REUSE_RUN_ID: ${{ github.run_id }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          sha="$(git rev-parse HEAD)"
          echo "This run tests commit $sha, tree $tree."
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "tested-sha=$sha" >> "$GITHUB_OUTPUT"
          set +e
          REUSE_TREE="$tree" bash tools/ci-reuse-green-tree.sh > "$RUNNER_TEMP/reuse.out"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "The reuse check itself exited $rc, so nothing it printed is used: running the full suite."
            : > "$RUNNER_TEMP/reuse.out"
          fi
          cat "$RUNNER_TEMP/reuse.out" >> "$GITHUB_OUTPUT"

      # What the last runs MEASURED, carried between them (claude-config#203, #144). Two stores
      # live here: what each suite cost, which decides the order the runner launches them in, and
      # what each SECTION of the sync suite cost, which decides how its shards are dealt.
      #
      # Without this the runner reported a measured launch order for none of the suites it ran, on
      # every single run, so CI ordered by file size and dealt its shards by counting sections while
      # both were measured on a Mac. The one machine whose timing actually matters to a person
      # waiting was the one machine with no measurements at all.
      #
      # A key unique to this run with a prefix to restore from, which is the rolling form: every
      # run saves what it measured and the next restores the most recent. A cold cache is not a
      # failure and is not silent either, because both readers SAY which rule they used.
      #
      # Restored here only, and saved only by the suite job once every part has added what it
      # measured: each part restores this same entry by its exact key, so all of them start from
      # the store the deal was made from.
      - name: Restore what earlier runs measured
        id: timings-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/claude-config
          key: claude-config-timings-${{ github.run_id }}
          restore-keys: |
            claude-config-timings-

      - name: A read-only run of the tool itself
        # The self-update gate decides whether a pulled claude-sync is safe to hand control to by
        # running exactly this and requiring it to finish. So a non-zero exit here does not fail one
        # check, it makes the tool declare every good version broken, and the damage surfaces four
        # sections away as a sync that quietly applied nothing. Run first, and on its own, so that
        # cause is never again read off a symptom.
        run: |
          d="$(mktemp -d)"
          mkdir -p "$d/home" "$d/repo/payload"
          printf '{"hooks":{}}\n' > "$d/home/settings.json"
          set +e
          out="$(CLAUDE_HOME="$d/home" SYNC_REPO="$d/repo" SYNC_NO_GIT=1 SYNC_NO_NOTIFY=1 bash claude-sync status 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          echo "claude-sync status exited $rc"
          [ "$rc" -eq 0 ]

      - name: No machine specific home path in the synced config
        # Runs on its own, and first, because this guard exists to catch a line somebody wrote a
        # moment ago and a check that only runs when it is remembered is not a guard at all (L27).
        # It is cheap, it fails early, and on this runner payload/ IS the synced tree, which is
        # exactly what it has to be clean. It runs again inside the step below as one suite among
        # the rest; that is the point, not a duplicate.
        run: bash payload/hooks/test-check-home-paths.sh

      - name: Deal the suites into parts by what they measured
        id: deal
        env:
          # How many parts, and so how many jobs run the suites. Four puts the longest part near
          # the two longest suites (test-claude-sync.sh and test-merge-when-ready.sh, about ten
          # minutes each on 2026-11-09), so a fifth part would mostly wait on them.
          HOOK_TESTS_DEAL: 4
        run: |
          set -o pipefail
          bash payload/hooks/run-all-tests.sh > "$RUNNER_TEMP/deal.tsv"
          cat "$RUNNER_TEMP/deal.tsv"
          echo "count=$HOOK_TESTS_DEAL" >> "$GITHUB_OUTPUT"
          echo "parts=[$(seq -s, 1 "$HOOK_TESTS_DEAL")]" >> "$GITHUB_OUTPUT"
          { echo "dealt<<DEALT_EOF"; cat "$RUNNER_TEMP/deal.tsv"; echo "DEALT_EOF"; } >> "$GITHUB_OUTPUT"

  parts:
    needs: deal
    name: suites part ${{ matrix.part }}
    strategy:
      # Every part runs to the end however another does, so one red part still reports the rest.
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.deal.outputs.parts) }}
    # NAMED, never ubuntu-latest (claude-config#597). GitHub moves ubuntu-latest to Ubuntu 26 on
    # 2026-10-19, and this suite leans on GNU tool and bash behaviour, so an image changing on a date
    # would turn main red with no commit to blame. Ubuntu 26.04 was tried first, on 2026-10-05 (run
    # 37365305290, bash 5.3.9): the only thing it broke was tests/run-on-linux.sh having no image for
    # it, which is added in the same change. Moving image again is a commit CI judges, and
    # tests/test-ci-workflow.sh refuses a -latest label.
    runs-on: ubuntu-26.04
    # The BACKSTOP, and it must never be the thing that fires. The suite sets its own two
    # deadlines and, when one of them fires, says which SECTION it died in, which is a far more
    # useful failure than a job the platform cuts off with no explanation at all.
    #
    # That ordering was quietly false for a while and nothing checked it (claude-config#210). The
    # comment here said the suite kills itself at 900s and that 20 minutes was set well above it.
    # #152 then raised SUITE_TIMEOUT for good reasons of its own, and this sentence went stale in
    # the direction that reads as safe: the job's backstop sat BELOW the suite's own ceiling, so on
    # any real hang the platform would have won and the section name would never have been printed.
    # A number in a comment goes stale silently (L210, L244). None of the figures here is measured;
    # the check named below is what holds them in order now.
    #
    # So the suite's deadlines are set HERE, for this runner, rather than inherited from a Mac's
    # defaults, and they are ordered with room between them: a stall is noticed at eight minutes,
    # the absolute ceiling is thirty, and the platform's backstop is the timeout-minutes below.
    #
    # RAISED 2026-09-19 (claude-config#473), from a 960s ceiling under a 20 minute backstop, and
    # this time against a measurement rather than a choice. The sentence above used to say the
    # whole run measured "roughly 200 seconds on 2026-08-30", and that number had gone stale in the
    # reassuring direction: on 2026-09-19 the sync suite measured 470s on main and 485s on a branch
    # adding one section. The suite refuses a run whose wall clock is more than HALF the ceiling
    # when its own processor time is what filled it, so a 960s ceiling put that refusal at 480s and
    # main was about ten seconds from red with nobody having changed anything. 1800 is roughly 3.7x
    # the measured 485s, which puts the refusal back at 900s, about 1.9x the real run. What that
    # refusal is FOR is still wanted, so the suite's runtime is tracked as its own issue rather
    # than being made invisible by the raise.
    #
    # THAT ISSUE WAS claude-config#492, and what it found is worth keeping here beside the numbers
    # it is about. Measured 2026-09-19: two full local runs within one percent of each other gave
    # 597s of processor time against 199s of wall clock across four shards, so the suite is bound
    # by its own work and not by waiting on the machine. This runner has two cores, which the step below prints rather
    # than asserts, and 597s of work on two cores has a floor near 300s of wall clock before this
    # runner's slower cores are counted. So raising HOOK_TESTS_BUDGET to buy more shards cannot
    # help, and neither can splitting the suite in two: on a two core runner the only thing that
    # moves the wall clock is less work, or a bigger runner, which costs money on a private
    # repository (L308 asks for the lever you did not pull to be named, and that is it).
    #
    # No hotspot was found to remove, on the same date. git barely appears in a sampled profile, the
    # seventeen sections that re-run the suite already scope their nested runs to one section or
    # nine, and each claude-sync invocation costs about 23ms, nearly all of it bash parsing a 9000
    # line script. The remaining 70% is spread across 150 sections at about 3.5s each, so bringing
    # the total down means making most of them cheaper rather than fixing a few.
    #
    # What DID ship is the thing that was missing: the section time is now totalled undivided and
    # held to a budget (SUITE_WORK_BUDGET_PCT, in the suite). The wall clock guard could not see
    # this growth because sharding divides wall clock, which is how 463s of section time on
    # 2026-08-29 became 759s on 2026-09-19 with nothing saying so.
    #
    # The ceiling must be at least twice the stall bound, which is its own separate requirement:
    # #112 refuses a ceiling under twice the stall, because a ceiling that close fires FIRST and
    # every real hang is then reported as a run that merely went on too long, which sends the
    # reader to raise a limit rather than to find the hang (L11). The first version of these values
    # had a 900s ceiling over a 600s stall and CI caught it on the next push; 960 over 480 sat
    # exactly on that floor, and 1800 over 480 leaves 840 seconds of room.
    #
    # A check in the suite now holds this ordering for every job in every workflow file, so a
    # second workflow cannot arrive without a timeout and none of these three numbers can cross
    # over without something saying so. That check is also why the backstop moved: it requires the
    # job's timeout to EXCEED the suite's own ceiling, so a thirty minute ceiling cannot sit under
    # a twenty minute backstop. Forty minutes was above it with room for the other eighty two
    # suites to finish afterwards, against a job that measured about fourteen minutes on 2026-09-19.
    #
    # Sixty since 2026-11-08. The job had grown to 30 to 39 minutes on a passing run (282 suites;
    # the slowest test-claude-sync.sh 558s, test-merge-when-ready.sh 458s, test-run-all-tests.sh
    # 419s, test-push-scope.sh 337s on main's run of 03:30 UTC), and on the slower runner group
    # (#2403, about 27% slower) it crossed forty: of the 16 runs started from 02:15 to 04:55 UTC
    # that night, 6 were cancelled at forty minutes with nothing failing, which stopped every
    # merge. Raising the ceiling only buys room; the growth itself is still unmeasured and is the
    # thing to cut (L299), so this number is a backstop to come down again, not a budget.
    #
    # FORTY since 2026-11-09 (claude-config#2463): each part runs about a quarter of the suites, so
    # a part measures nearer ten minutes than forty, and the backstop still sits above the suite's
    # own thirty minute ceiling as the check above requires.
    timeout-minutes: 40
    steps:
      # FIRST, before anything that takes time (claude-config#1901). The runner reads this job's
      # timeout-minutes above from this file and holds every flake recheck to end before it, so a
      # suite that hangs is named before the job is cancelled. Counted from the runner's own start
      # instead, the minutes the steps before it took would be missing, which is the direction that
      # lets the job be cancelled first. tests/test-ci-workflow.sh holds this step in first place.
      - name: Record when the job started
        run: echo "HOOK_TESTS_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      # On a reuse (claude-config#2690) this is the only step after the first that runs, so the
      # check still reports under its own name and its log says what it stood on rather than reading
      # as a fresh pass. Every other step here carries the opposite condition, and
      # tests/test-ci-workflow.sh refuses a step that does not.
      - name: Reused a green run of this exact tree
        if: needs.deal.outputs.reused-run != ''
        env:
          RUN_URL: ${{ needs.deal.outputs.reused-url }}
          RUN_SHA: ${{ needs.deal.outputs.reused-sha }}
          TREE: ${{ needs.deal.outputs.tree }}
        run: echo "NOT RUN AGAIN. Tree $TREE already passed in run $RUN_URL on commit $RUN_SHA, so this part's suites were not run in this run."

      # Pinned to a commit, with the version beside it, so the code that runs cannot change under
      # the same tag, and on a major that runs on Node 24 rather than the deprecated Node 20
      # (claude-config#597). tests/test-ci-workflow.sh refuses a tag, or a major still on Node 20.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.deal.outputs.reused-run == ''
        with:
          # History IS needed now: the changed-section step below diffs this push against its base
          # to work out which sections to run on their own, and a shallow clone has no base commit
          # to diff against. It would not fail loudly either, it would derive zero changed sections,
          # which reads exactly like a clean audit (#105). The repo is small and this is cheap.
          fetch-depth: 0

      # The store the deal was made from, by its exact key, so the launch order and the sync suite's
      # shards are dealt from the same numbers in every part. A cold deal restored nothing, and
      # neither does this.
      - name: Restore what the deal was made from
        id: timings-cache
        if: needs.deal.outputs.reused-run == '' && needs.deal.outputs.timings-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/claude-config
          key: ${{ needs.deal.outputs.timings-key }}
          fail-on-cache-miss: true

      - name: Record the environment the suite is judged in
        if: needs.deal.outputs.reused-run == ''
        # Printed rather than assumed. Several checks shell out to pgrep, mktemp, rsync, jq and
        # perl, and a version difference here is the first thing worth seeing when a run fails on
        # the runner but passes on a Mac.
        run: |
          bash --version | head -1
          git --version
          rsync --version | head -1
          jq --version
          perl --version | sed -n '2p'
          # The send checks the hooks block with hooks/lib/hook-registration.py (#413), so the suite
          # needs python3 too. Named here because this step is the list run-on-linux.sh builds its
          # container from: unnamed, the container had none and failed four checks CI passed.
          python3 --version
          # require-changelog-tag.sh and pr-merge-quiz.sh run `node -e`, and test-changelog-tag.sh
          # runs node directly. Named for the same reason as python3, and held to it by
          # tests/test-ci-environment-tools.sh, which fails on an invoked interpreter not named here.
          node --version
          # The pinned TypeScript compiler is installed with npm ci before the suites (#895).
          npm --version
          echo "pgrep: $(command -v pgrep || echo MISSING)"
          echo "TMPDIR: ${TMPDIR:-<unset, /tmp will be used>}"
          # How many cores this runner actually has (claude-config#210). The HOOK_TESTS_BUDGET
          # below is set to 4 on the stated grounds that this runner has two, and that is a claim
          # about the machine that nothing measured. Printed, so the next person to reason about
          # the budget reads the number rather than the sentence (L188).
          echo "cores: $(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo UNKNOWN)"
          # Which processor (claude-config#2403). The runners come in two speeds, the slower about
          # 27% slower on every suite (#1494, #2369), while the core count and image printed above
          # do not differ between them, so only the model can name the hardware behind each group.
          echo "processor: $(awk -F': *' '/^model name/ && !n++ { print $2 }' /proc/cpuinfo 2>/dev/null | grep . || sysctl -n machdep.cpu.brand_string 2>/dev/null || echo UNKNOWN)"

      # Every hidden Chrome the suites start is the shared Playwright's headless shell, never Google
      # Chrome (claude-config#2191), and it is found here the same way as on the Macs: install-playwright.sh
      # puts it under HOME at the version shared-playwright.json pins, in the folder that file names
      # (read from it, never written twice). Cached on that file, so a run downloads it only when the pin
      # moves. An install that fails fails the job by name, rather than leaving every browser section of
      # the design rounds suites to report unmeasured.
      - name: Where the separate headless Chrome goes
        id: hidden-chrome
        if: needs.deal.outputs.reused-run == ''
        run: echo "root=$HOME/$(jq -r .root payload/skills/design-rounds/score/shared-playwright.json)" >> "$GITHUB_OUTPUT"

      - name: Restore the separate headless Chrome
        if: needs.deal.outputs.reused-run == ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.hidden-chrome.outputs.root }}
          key: design-score-playwright-${{ runner.os }}-${{ hashFiles('payload/skills/design-rounds/score/shared-playwright.json') }}

      - name: Install the separate headless Chrome
        if: needs.deal.outputs.reused-run == ''
        run: bash payload/skills/design-rounds/score/install-playwright.sh

      - name: Install the pinned TypeScript compiler
        if: needs.deal.outputs.reused-run == ''
        # tools/check-mod-noun-waits.sh resolves every call a mod's noun makes with this compiler's
        # own checker (#895) and refuses outright when it cannot load it, so tests/test-mods.sh
        # needs it here. The lockfile pins the version and carries the linux-x64 binary.
        run: npm ci --prefix tools/typescript --no-audit --no-fund

      # What is in the store now came from the deal; anything newer than this was written by this
      # part's suites, and only that is handed to the suite job to merge.
      - name: Mark the store before the suites run
        if: needs.deal.outputs.reused-run == ''
        run: touch "$RUNNER_TEMP/before-suites"

      - name: Every suite of this part
        if: needs.deal.outputs.reused-run == ''
        # ONE step, and no list. This used to be four steps naming four directories, which is the
        # hand maintained list the runner itself refuses to keep (L96) written one level up in a
        # file nobody reads when adding a test. Written down 2026-08-21, payload/skills/milestone/
        # was never in that list:
        # 233 checks that ran nowhere, on this runner or on a Mac, and nothing anywhere said so
        # (#120). The runner now asks git which directories hold a suite, so a suite added
        # anywhere is run from the day it lands, and a directory that turns up holding none is a
        # failure rather than a quiet pass.
        #
        # This runner is Linux and the suites were written on a Mac, so anything that depends on
        # a BSD flag or a macOS only tool will say so here rather than being assumed either way.
        #
        # SUITE_DEBUG prints what the sync suite actually said in the scenarios that only fail
        # here, so a failure on this runner can be diagnosed from evidence rather than from a
        # theory (#52).
        env:
          SUITE_DEBUG: 1
          # Below the job's own backstop, and in order, so the suite is always the thing that
          # reports a hang and always gets to name the section (claude-config#210). A check in the
          # suite holds the ordering; the reasoning for both numbers is on timeout-minutes above.
          #
          # The stall bound is UNCHANGED at 480 and is still the right number: it is what catches a
          # hang, and the slowest single section measured 11 seconds on a Mac on 2026-09-19, so it
          # is many times the longest section rather than anything near the whole run. Until #473
          # it was also doing a second job nobody had asked it to do, because the parent of a
          # sharded run never reaches a section itself, so its mark never moved and this number was
          # silently capping the WHOLE run at eight minutes. With that fixed it bounds only what it
          # names.
          SUITE_STALL_TIMEOUT: 480
          SUITE_TIMEOUT: 1800
          # This runner has two cores, and the budget in #136 is granted to the suites running at
          # once, so the default here is one process each and the sync suite stops sharding: its
          # fan-out, and #137's check that the shards covered every section between them, would
          # then run on a Mac and NOWHERE ELSE. Measured on 2026-08-21, on the run that introduced
          # the budget: "up to 2 suite(s) at once, 1 slot(s) each". Four buys two suites at once
          # with two shards each, which is twice this runner's cores and deliberately so: mild
          # oversubscription here costs seconds, and a path that only ever runs on the machine of
          # whoever wrote it is a path CI does not check at all (L88, L98).
          HOOK_TESTS_BUDGET: 4
          # Which of the deal's parts this job runs (claude-config#2463). The runner refuses a deal
          # that does not cover exactly the suites this tree holds, so a suite in no part is a red
          # part, never a suite quietly run nowhere.
          HOOK_TESTS_PART: ${{ matrix.part }}
          HOOK_TESTS_PARTS: ${{ needs.deal.outputs.count }}
          HOOK_TESTS_DEALT: ${{ runner.temp }}/deal.tsv
          DEALT: ${{ needs.deal.outputs.dealt }}
        # Captured as well as printed, so the step below can assert on what it said. `tee` keeps
        # the log identical to what it was, and the pipeline's exit status is taken from the
        # runner rather than from tee, or a failing suite would be reported as a pass.
        run: |
          set -o pipefail
          printf '%s\n' "$DEALT" > "$HOOK_TESTS_DEALT"
          bash payload/hooks/run-all-tests.sh 2>&1 | tee "$RUNNER_TEMP/run-all-tests.log"

      - name: The measured timings were actually used
        if: needs.deal.outputs.reused-run == ''
        # #203 and #144 both decide how work is divided from stored measurements, and the cache
        # step above carries those between runs. Nothing noticed it STOPPING. The runner prints a
        # passing suite's own output nowhere, so if the cache key scheme broke or the store stopped
        # being written, CI would fall back to dividing by counting and every run would simply be
        # slower: the silent regression this milestone existed to remove, reintroduced one level up
        # (claude-config#232, L3, L98).
        #
        # A COLD cache is not a failure. The key is per run with a prefix to restore from, so the
        # first run on a new branch legitimately has nothing to restore, and this branches on
        # whether the cache step matched a key rather than on what the numbers happen to be.
        # Judging by the numbers alone would make "cold by design" and "the store stopped being
        # written" the same reading (L11).
        env:
          HOOK_TESTS_PART: ${{ matrix.part }}
        run: |
          log="$RUNNER_TEMP/run-all-tests.log"
          [ -s "$log" ] || { echo "The suite log is empty, so nothing was measured about it." >&2; exit 1; }
          order="$(grep -m1 'launch order from measured wall clock' "$log" || true)"
          [ -n "$order" ] || { echo "The runner printed no launch order line at all, so how it ordered the suites is unknown." >&2; exit 1; }
          echo "$order"
          measured="$(printf '%s\n' "$order" | sed -n 's/.*wall clock for \([0-9][0-9]*\) of \([0-9][0-9]*\) suite.*/\1/p')"
          total="$(printf '%s\n' "$order" | sed -n 's/.*wall clock for \([0-9][0-9]*\) of \([0-9][0-9]*\) suite.*/\2/p')"
          [ -n "$measured" ] && [ -n "$total" ] || { echo "The launch order line did not carry the two numbers this reads." >&2; exit 1; }
          div="$(grep -m1 'SUITE-DIVISION ' "$log" || true)"
          if [ -n "$div" ]; then echo "$div"; fi
          if [ -z "${{ steps.timings-cache.outputs.cache-matched-key }}" ]; then
            echo "No timings cache was restored, so this run is COLD by design: $measured of $total suites measured."
            exit 0
          fi
          echo "Cache restored from ${{ steps.timings-cache.outputs.cache-matched-key }}."
          if [ "$measured" -lt 1 ]; then
            echo "A timings cache was restored and the runner still measured NONE of the $total suites, so the store is not being read. Ordering fell back to file size." >&2
            exit 1
          fi
          # PARTIALLY warm is the normal state: a section or suite added since the last run has no
          # record yet and takes the stand-in. It is reported rather than refused, and the numbers
          # are in the log so a drop from 44 of 44 to 3 of 44 is visible without a threshold nobody
          # calibrated (L172).
          echo "Measured wall clock used for $measured of $total suite(s)."
          # A suite only divides its work when it is given more than one slot, and how many it
          # gets is decided by the budget, so the absence of a division line is a legitimate state
          # rather than a fault. Judged by what the run SAID about its slots, not assumed: refusing
          # a run that never sharded would be a false red on a correct run, which is the one thing
          # a guard like this must not do (L36, L324).
          slots="$(sed -n 's/.* \([0-9][0-9]*\) slot(s) each.*/\1/p' "$log" | awk 'NR<=1')"
          case "${slots:-}" in ''|*[!0-9]*) slots=0 ;; esac
          if [ -z "$div" ]; then
            # Only the sync suite divides its own work, and it runs in one part (#2463).
            if ! awk -F'\t' -v p="$HOOK_TESTS_PART" '$1 == p && $2 == "tests/test-claude-sync.sh" { f = 1 } END { exit !f }' "$RUNNER_TEMP/deal.tsv"; then
              echo "The sync suite, the one suite that divides its own work, was dealt to another part, so there was nothing here to divide."
              exit 0
            fi
            if [ "$slots" -le 1 ]; then
              echo "No suite divided its own work, and the runner gave each suite $slots slot(s), so there was nothing to divide. Nothing is asserted about section timings on this run."
              exit 0
            fi
            echo "The runner gave each suite $slots slot(s), so the sync suite sharded, and no suite reported how it divided its work. That reporting has stopped." >&2
            exit 1
          fi
          dm="$(printf '%s\n' "$div" | sed -n 's/.*measured=\([0-9][0-9]*\).*/\1/p')"
          dt="$(printf '%s\n' "$div" | sed -n 's/.*total=\([0-9][0-9]*\).*/\1/p')"
          [ -n "$dm" ] && [ -n "$dt" ] || { echo "The SUITE-DIVISION line did not carry its two numbers." >&2; exit 1; }
          if [ "$dm" -lt 1 ]; then
            echo "A timings cache was restored and the shards were dealt from measured time for NONE of the $dt sections, so the section store is not being read either." >&2
            exit 1
          fi
          echo "Shards dealt from measured section time for $dm of $dt section(s)."

      # What this part's suites measured, for the suite job to merge into the one store the next
      # deal reads. Only files written since the mark, so one part's stale copy of a suite another
      # part ran can never overwrite the fresh one. Kept only from a passing part, as the single job
      # kept its cache only on a pass.
      - name: Collect what this part measured
        if: needs.deal.outputs.reused-run == ''
        run: |
          mkdir -p "$RUNNER_TEMP/measured"
          if [ -d "$HOME/.cache/claude-config" ]; then
            cd "$HOME/.cache/claude-config"
            find . -type f -newer "$RUNNER_TEMP/before-suites" -exec cp --parents {} "$RUNNER_TEMP/measured/" \;
          fi
          n="$(find "$RUNNER_TEMP/measured" -type f | wc -l)"
          echo "$n record(s) written by this part's suites."
          [ "$n" -gt 0 ] || { echo "This part's suites wrote no timing record at all, so the next deal would know nothing new about them." >&2; exit 1; }
          # One archive, because an artifact refuses a file name holding a colon and the sync suite
          # names each section's record after its heading (first CI run of the parts, 2026-11-09).
          tar -C "$RUNNER_TEMP/measured" -cf "$RUNNER_TEMP/measured.tar" .

      - name: Hand what this part measured to the suite job
        if: needs.deal.outputs.reused-run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-timings-${{ matrix.part }}
          path: ${{ runner.temp }}/measured.tar
          retention-days: 1
          if-no-files-found: error

      - name: Each changed suite section, run on its own
        # In the last part only, so it runs once per push as it did in the single job (#2463).
        if: needs.deal.outputs.reused-run == '' && matrix.part == fromJSON(needs.deal.outputs.count)
        # The suite's sections are independent: every one after the prelude runs alone, and the
        # single real dependency left is declared with a `# needs:` comment. How many that is is
        # not written down here: it changes, and a number in a comment goes stale silently (#140).
        # Timed, and written down, on 2026-08-21. The full suite cannot notice
        # when that stops being true, because it runs everything in order and every fixture an
        # earlier section built is always there. Running a section BY ITSELF is the only run in
        # which a missing prerequisite shows up at all.
        #
        # Scoped to the diff on purpose. A push that does not touch the suite costs nothing here,
        # and a push that adds or edits a section pays for exactly that section, which is precisely
        # when a dependency can be introduced. Roughly 7 seconds per changed section.
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          [ -n "$base" ] || base="$PUSH_BEFORE"
          # A first push, a force push and a freshly created branch all hand over a base that is
          # empty or that does not exist here. Falling back to the previous commit keeps the step
          # meaningful; being unable to name ANY base is reported as a failure rather than as a
          # step that found nothing to do, because those two look identical in a green run (L98).
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "No base commit could be resolved, so no section was scoped and NOTHING was audited. Refusing to report this as a pass." >&2
            exit 1
          fi
          echo "Diffing against $base"
          bash tests/audit-changed-sections.sh "$base"

  # THE FAN IN, and the name every merge waits on (claude-config#2463, L305). block-red-merge.sh and
  # merge-when-ready.sh read every check in the rollup rather than one by name, and main has no
  # branch protection naming a check, but `suite` is the name the history and every reader knows,
  # so it stays the one verdict: green only when the deal and every part were green. `always()`
  # makes it run when a part failed, so a red part is a red `suite` rather than a skipped one,
  # which a reader of the rollup could take for nothing to report.
  suite:
    needs: [deal, parts]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      # First, as in the parts job, where the runner reads it (claude-config#1901).
      - name: Record when the job started
        run: echo "HOOK_TESTS_JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: The deal and every part passed
        env:
          DEAL: ${{ needs.deal.result }}
          PARTS: ${{ needs.parts.result }}
        run: |
          echo "deal: $DEAL; parts: $PARTS"
          if [ "$DEAL" != success ] || [ "$PARTS" != success ]; then
            echo "Not every job that runs the suites passed (the deal $DEAL, the parts $PARTS), so neither do the suites. The failing part's own log names the suite." >&2
            exit 1
          fi

      # On a reuse (claude-config#2690) the verdict above still runs, and this says, in the log and
      # on the run's summary page, which run and commit the green stands on. Nothing below runs.
      - name: Reused a green run of this exact tree
        if: needs.deal.outputs.reused-run != ''
        env:
          RUN_URL: ${{ needs.deal.outputs.reused-url }}
          RUN_SHA: ${{ needs.deal.outputs.reused-sha }}
          TREE: ${{ needs.deal.outputs.tree }}
        run: |
          msg="NOT RUN AGAIN. Tree $TREE already passed in run $RUN_URL on commit $RUN_SHA, so no suite ran in this run and this green is that run's."
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

      # The store the deal read, then each part's new records over it, saved as the one entry the
      # next run's deal restores. Saved only here, once every part has passed.
      - name: Restore what the deal was made from
        if: needs.deal.outputs.reused-run == '' && needs.deal.outputs.timings-key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/claude-config
          key: ${{ needs.deal.outputs.timings-key }}
          fail-on-cache-miss: true

      - name: Fetch what each part measured
        if: needs.deal.outputs.reused-run == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-timings-*
          path: ${{ runner.temp }}/parts

      - name: Merge every part's records into the store
        if: needs.deal.outputs.reused-run == ''
        env:
          COUNT: ${{ needs.deal.outputs.count }}
        run: |
          # Counted against the deal, so a part that never ran is caught here too: on the first CI run
          # of the parts (2026-11-09) GitHub started two of the four matrix jobs and never created
          # the other two, and a needs result can only speak for the jobs that exist.
          got="$(find "$RUNNER_TEMP/parts" -name measured.tar -type f | wc -l)"
          echo "Records from $got of $COUNT part(s)."
          [ "$got" -eq "$COUNT" ] || { echo "Only $got of $COUNT parts handed back what they measured, so either a part never ran or the next deal would be made from a store missing the rest." >&2; exit 1; }
          mkdir -p "$HOME/.cache/claude-config"
          find "$RUNNER_TEMP/parts" -name measured.tar -type f -exec tar -C "$HOME/.cache/claude-config" -xf {} \;
          echo "The store now holds $(find "$HOME/.cache/claude-config/suite-timings" -type f 2>/dev/null | wc -l) suite record(s)."

      - name: Save the merged store for the next run
        if: needs.deal.outputs.reused-run == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/claude-config
          key: claude-config-timings-${{ github.run_id }}

      # LAST, so only a full run whose every step passed records its tree for a later run to stand on
      # (claude-config#2690), and never a run that itself reused, so a reuse always points at a run
      # that ran the suites. The record holds the commit this run tested (for a pull request, the
      # merge commit GitHub made), which the helper reads back from GitHub by its sha before trusting
      # it. The name is the tree, the one key a later run can look up. Kept a week: the merge line
      # it serves is hours long, and a missing record only means a full run.
      - name: Write down the tree this run proved
        if: needs.deal.outputs.reused-run == ''
        env:
          TREE: ${{ needs.deal.outputs.tree }}
          SHA: ${{ needs.deal.outputs.tested-sha }}
        run: |
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] && [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "The deal handed over tree '$TREE' and commit '$SHA', so there is nothing true to record." >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/green-tree"
          printf 'sha=%s\ntree=%s\nrun=%s\n' "$SHA" "$TREE" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/green-tree/tested.txt"
          cat "$RUNNER_TEMP/green-tree/tested.txt"

      - name: Record that this tree passed
        if: needs.deal.outputs.reused-run == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: green-tree-${{ needs.deal.outputs.tree }}
          path: ${{ runner.temp }}/green-tree/tested.txt
          retention-days: 7
          if-no-files-found: error
