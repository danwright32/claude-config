<!--
  The phone card. Same content as field-card.md, rendered for the device it is actually read on.

  Rules, all of them inherited from the markdown card:
    Under 100 lines of content. Delete every section that does not apply.
    No jargon. No pronoun without a name. No invented clock times.
    Every shot: marker, shot, size.

  Rules specific to this file:
    SELF CONTAINED. No network. No fonts, no scripts, no images from anywhere.
      It will be opened in a lobby on a phone with no signal.
    Light and dark both, via prefers-color-scheme. The room may be a dark hall
      or a glass lobby at midday, and he cannot fix the theme with one hand.
    Checkboxes persist to localStorage. He ticks shots off as he banks them.
      Bump the storage KEY when the card changes, or old ticks land on new shots.
    Body text no smaller than 18px, headings no smaller than 15px.
    Nothing scrolls horizontally.

  Placeholders: {EVENT} {VENUE} {DOORS} {SHOW} {OUT} {NAME} {PHONE} {PHONE_E164}
  Optional blocks are marked. Delete them, do not leave them empty.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>{EVENT} field card</title>
<style>
  :root{
    --bg:#ffffff; --fg:#101014; --dim:#5a5a66; --line:#d8d8e0;
    --hand:#a8500a; --park:#0a5f7a; --alarm:#b3001b; --panel:#f4f4f7;
    --done:#8e8e99;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0c0c0f; --fg:#f4f4f6; --dim:#a0a0ad; --line:#2a2a33;
      --hand:#ffb45c; --park:#5cd2f0; --alarm:#ff6b7f; --panel:#16161c;
      --done:#61616d;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg)}
  body{
    font:600 19px/1.42 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px 16px calc(64px + env(safe-area-inset-bottom));
    max-width:680px;margin:0 auto;overflow-x:hidden;
  }
  /* Headings must be unmistakably headings at a glance: a phase heading is a
     thick rule you cannot mistake for a shot, a section heading a thinner one.
     Dan, 2026-07-23: "make it clearer when something is a heading." */
  h1{
    font-size:26px;line-height:1.15;margin:40px 0 4px;letter-spacing:-.01em;
    padding-bottom:8px;border-bottom:4px solid var(--fg);
  }
  h1:first-child{margin-top:0}
  h2{
    font-size:15px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);margin:28px 0 6px;padding-bottom:6px;
    border-bottom:2px solid var(--line);font-weight:800;
  }
  .lede{color:var(--dim);font-weight:500;font-size:17px;margin:0 0 4px}
  .hard{color:var(--alarm);font-weight:800}
  a{color:inherit;text-decoration-thickness:2px;text-underline-offset:3px}
  .settings{
    background:var(--panel);border:2px solid var(--line);border-radius:12px;
    padding:12px 14px;margin:16px 0 4px;font-size:18px;
  }
  .settings b{display:block;font-size:19px}
  .settings .note{color:var(--dim);font-weight:600;font-size:16px;margin-top:6px}
  .key{font-size:18px;margin:6px 0}
  .hand{color:var(--hand);font-weight:800}
  .park{color:var(--park);font-weight:800}
  .big{font-size:30px;line-height:1.1;font-weight:800;margin:6px 0 8px;letter-spacing:-.02em}
  .story{font-size:24px;line-height:1.2;font-weight:800;margin:4px 0 8px}
  .say{color:var(--dim);font-weight:600;font-size:17px}
  ul{list-style:none;margin:0;padding:0}
  li{margin:0;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  label{display:flex;gap:12px;align-items:flex-start;padding:13px 2px;cursor:pointer}
  input[type=checkbox]{
    appearance:none;flex:0 0 auto;width:26px;height:26px;margin:0;
    border:2.5px solid var(--dim);border-radius:6px;background:transparent;
    position:relative;top:1px;
  }
  input[type=checkbox]:checked{background:var(--fg);border-color:var(--fg)}
  input[type=checkbox]:checked::after{
    content:"";position:absolute;left:7px;top:2px;width:7px;height:14px;
    border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg);
  }
  input[type=checkbox]:checked + .txt{color:var(--done);text-decoration:line-through}
  .txt{flex:1;min-width:0}
  .size{
    display:inline-block;margin-left:6px;padding:1px 7px;border-radius:5px;
    border:1.5px solid var(--line);color:var(--dim);
    font-size:13px;letter-spacing:.09em;font-weight:800;white-space:nowrap;vertical-align:2px;
  }
  .plain li{border:0;padding:7px 0;font-weight:600}
  .plain li::before{content:"›";color:var(--dim);margin-right:10px;font-weight:800}
  .callout{border:3px solid var(--alarm);border-radius:12px;padding:14px;margin:10px 0}
  .callout h2{border:0;margin:0 0 4px;padding:0;color:var(--alarm)}
  .callout .big{color:var(--fg)}
  .rules{font-size:18px;line-height:1.75;font-weight:600}
  .stop{font-weight:800;margin:12px 0 0}
  .foot{
    position:fixed;left:0;right:0;bottom:0;background:var(--bg);
    border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    max-width:680px;margin:0 auto;
  }
  .foot span{color:var(--dim);font-size:15px;font-weight:600}
  button{
    font:800 15px/1 inherit;font-family:inherit;color:var(--fg);background:transparent;
    border:2px solid var(--line);border-radius:8px;padding:9px 12px;
  }
  .star{color:#f0a500;font-weight:700;margin-right:.15em}
</style>
</head>
<body>

<!--CARD-->

<div class="foot">
  <span id="count">0 of 0 ticked</span>
  <button id="reset" type="button">Reset all</button>
</div>

<script>
(function(){
  var KEY = "{event-slug}-card-v1";
  var boxes = Array.prototype.slice.call(document.querySelectorAll("input[type=checkbox]"));
  boxes.forEach(function(b,i){ b.dataset.i = i; });
  function load(){
    var raw; try { raw = localStorage.getItem(KEY); } catch(e) { return; }
    if(!raw) return;
    try { JSON.parse(raw).forEach(function(i){ if(boxes[i]) boxes[i].checked = true; }); } catch(e){}
  }
  function save(){
    var on = boxes.filter(function(b){return b.checked}).map(function(b){return +b.dataset.i});
    try { localStorage.setItem(KEY, JSON.stringify(on)); } catch(e){}
  }
  function count(){
    var n = boxes.filter(function(b){return b.checked}).length;
    document.getElementById("count").textContent = n + " of " + boxes.length + " ticked";
  }
  boxes.forEach(function(b){ b.addEventListener("change", function(){ save(); count(); }); });
  document.getElementById("reset").addEventListener("click", function(){
    boxes.forEach(function(b){ b.checked = false; }); save(); count();
  });
  load(); count();
})();
</script>
</body>
</html>
